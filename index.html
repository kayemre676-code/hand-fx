<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI Hand Arena - 3 in 1</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050505; overflow: hidden; font-family: -apple-system, sans-serif; user-select: none; }
    #container { position: relative; width: 100vw; height: 100dvh; transition: transform 0.05s; }
    video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #hud {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 10;
      background: rgba(0, 0, 0, 0.8); padding: 6px 10px;
      border-radius: 30px; border: 1px solid rgba(0, 242, 255, 0.4);
      backdrop-filter: blur(6px);
    }
    .mode-btn {
      background: transparent; color: #ccc; border: none;
      padding: 7px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .mode-btn.active { background: #00f2ff; color: #000; box-shadow: 0 0 12px rgba(0, 242, 255, 0.6); }
    #status {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85); color: #fff; padding: 9px 20px;
      border-radius: 20px; font-size: 13px; font-weight: bold; z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.25); white-space: nowrap;
    }
    #scoreBoard {
      position: absolute; top: 68px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75); color: #00f2ff; padding: 6px 18px;
      border-radius: 15px; font-size: 16px; font-weight: 800; z-index: 10;
      display: none; border: 1px solid rgba(0, 242, 255, 0.4);
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="hud">
      <button class="mode-btn active" data-mode="powers">⚡ Güçler</button>
      <button class="mode-btn" data-mode="holo">🌐 3D Holo</button>
      <button class="mode-btn" data-mode="ninja">⚔️ Kesme</button>
      <button id="skel-btn" class="mode-btn" style="color:#ff9f43;">İskelet: AÇIK</button>
    </div>
    <div id="scoreBoard">SKOR: 0</div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="fxCanvas"></canvas>
    <div id="status">Sistem başlatılıyor...</div>
  </div>

  <script>
    const container = document.getElementById('container');
    const video = document.getElementById('video');
    const fxCanvas = document.getElementById('fxCanvas');
    const fxCtx = fxCanvas.getContext('2d');
    const statusText = document.getElementById('status');
    const scoreBoard = document.getElementById('scoreBoard');

    let currentMode = 'powers'; // 'powers' | 'holo' | 'ninja'
    let showSkeleton = true;
    let isProcessing = false;

    // Ortak Efekt Değişkenleri
    let particles = [];
    let fireballs = [];
    let plasmaCharge = 0;

    // 3D Hologram Değişkenleri
    let holoRotX = 0.4, holoRotY = 0;
    let holoScale = 1.0;
    let holoPoints = [];
    for (let i = 0; i < 90; i++) {
      const phi = Math.acos(-1 + (2 * i) / 90);
      const theta = Math.sqrt(90 * Math.PI) * phi;
      holoPoints.push({
        x: Math.cos(theta) * Math.sin(phi),
        y: Math.sin(theta) * Math.sin(phi),
        z: Math.cos(phi)
      });
    }

    // Lazer Kesme (Ninja) Değişkenleri
    let bladeTrail = [];
    let targets = [];
    let score = 0;
    let lastSpawn = 0;

    const CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
      [13,17],[0,17],[17,18],[18,19],[19,20]
    ];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      fxCanvas.width = window.innerWidth * dpr;
      fxCanvas.height = window.innerHeight * dpr;
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Mod Seçim Butonları
    document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        particles = [];
        targets = [];
        bladeTrail = [];
        score = 0;
        scoreBoard.innerText = "SKOR: 0";
        scoreBoard.style.display = currentMode === 'ninja' ? 'block' : 'none';
      });
    });

    document.getElementById('skel-btn').addEventListener('click', (e) => {
      showSkeleton = !showSkeleton;
      e.target.innerText = showSkeleton ? 'İskelet: AÇIK' : 'İskelet: KAPALI';
      e.target.style.color = showSkeleton ? '#ff9f43' : '#666';
    });

    // --- PARÇACIK & EFEKT FONKSİYONLARI ---
    function spawnFire(x, y, count = 6) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 35,
          y: y + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 3,
          vy: -Math.random() * 6 - 2,
          size: Math.random() * 18 + 8,
          life: 1.0, decay: 0.035, type: 'fire'
        });
      }
    }

    function spawnLightning(x, y) {
      fxCtx.save();
      fxCtx.globalCompositeOperation = 'lighter';
      for (let b = 0; b < 3; b++) {
        fxCtx.beginPath();
        let cx = x, cy = y;
        fxCtx.moveTo(cx, cy);
        for (let step = 0; step < 6; step++) {
          cx += (Math.random() - 0.5) * 65;
          cy += (Math.random() - 0.5) * 65;
          fxCtx.lineTo(cx, cy);
        }
        fxCtx.strokeStyle = b === 0 ? '#ffffff' : '#00f2ff';
        fxCtx.shadowColor = '#00f2ff';
        fxCtx.shadowBlur = 15;
        fxCtx.lineWidth = b === 0 ? 2.5 : 1.5;
        fxCtx.stroke();
      }
      fxCtx.restore();
    }

    function spawnBurst(x, y, color, count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 5 + 2,
          life: 1.0, decay: 0.04, color, type: 'spark'
        });
      }
    }

    function launchPlasmaBall(x, y, radius) {
      fireballs.push({
        x, y,
        targetX: window.innerWidth / 2,
        targetY: window.innerHeight / 2,
        size: radius, life: 1.0
      });
      container.style.transform = `translate(${(Math.random()-0.5)*18}px, ${(Math.random()-0.5)*18}px)`;
      setTimeout(() => { container.style.transform = 'translate(0,0)'; }, 130);
    }

    function updateAndDrawParticles() {
      fxCtx.globalCompositeOperation = 'lighter';
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        fxCtx.beginPath();
        if (p.type === 'fire') {
          fxCtx.fillStyle = `rgba(255, ${Math.floor(p.life * 165)}, 20, ${p.life * 0.85})`;
          fxCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        } else {
          fxCtx.fillStyle = p.color;
          fxCtx.globalAlpha = p.life;
          fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        }
        fxCtx.fill();
        fxCtx.globalAlpha = 1.0;
      }

      for (let i = fireballs.length - 1; i >= 0; i--) {
        const fb = fireballs[i];
        fb.x += (fb.targetX - fb.x) * 0.12;
        fb.y += (fb.targetY - fb.y) * 0.12;
        fb.size += 16; fb.life -= 0.045;
        if (fb.life <= 0) {
          spawnBurst(fb.x, fb.y, '#ff00ff', 30);
          fireballs.splice(i, 1); continue;
        }
        const grad = fxCtx.createRadialGradient(fb.x, fb.y, fb.size * 0.1, fb.x, fb.y, fb.size);
        grad.addColorStop(0, `rgba(255, 255, 255, ${fb.life})`);
        grad.addColorStop(0.4, `rgba(180, 0, 255, ${fb.life * 0.9})`);
        grad.addColorStop(0.8, `rgba(0, 242, 255, ${fb.life * 0.6})`);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        fxCtx.fillStyle = grad;
        fxCtx.beginPath();
        fxCtx.arc(fb.x, fb.y, fb.size, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.globalCompositeOperation = 'source-over';
    }

    // --- 2. MOD: 3D IRON MAN HOLOGRAM ---
    function renderHologram(cx, cy, scale, rotX, rotY, isOverload) {
      fxCtx.save();
      fxCtx.globalCompositeOperation = 'lighter';
      const baseR = 110 * scale;
      const mainColor = isOverload ? '#ff3838' : '#00f2ff';

      // Dış HUD Halkaları
      fxCtx.strokeStyle = mainColor;
      fxCtx.lineWidth = 2;
      fxCtx.beginPath();
      fxCtx.arc(cx, cy, baseR * 1.25, rotY, rotY + Math.PI * 1.5);
      fxCtx.stroke();

      fxCtx.beginPath();
      fxCtx.arc(cx, cy, baseR * 1.35, -rotY * 1.5, -rotY * 1.5 + Math.PI);
      fxCtx.stroke();

      // 3D Küre Noktaları ve Bağlantıları
      const projected = holoPoints.map(pt => {
        // Y ekseni dönüşü
        const x1 = pt.x * Math.cos(rotY) - pt.z * Math.sin(rotY);
        const z1 = pt.z * Math.cos(rotY) + pt.x * Math.sin(rotY);
        // X ekseni dönüşü
        const y2 = pt.y * Math.cos(rotX) - z1 * Math.sin(rotX);
        const z2 = z1 * Math.cos(rotX) + pt.y * Math.sin(rotX);

        const fov = 300 / (300 + z2 * baseR);
        return {
          x: cx + x1 * baseR * fov,
          y: cy + y2 * baseR * fov,
          z: z2
        };
      });

      fxCtx.strokeStyle = isOverload ? 'rgba(255, 56, 56, 0.35)' : 'rgba(0, 242, 255, 0.35)';
      fxCtx.lineWidth = 1;
      for (let i = 0; i < projected.length; i++) {
        for (let j = i + 1; j < projected.length; j++) {
          const d = Math.hypot(projected[i].x - projected[j].x, projected[i].y - projected[j].y);
          if (d < 42 * scale) {
            fxCtx.beginPath();
            fxCtx.moveTo(projected[i].x, projected[i].y);
            fxCtx.lineTo(projected[j].x, projected[j].y);
            fxCtx.stroke();
          }
        }
      }

      projected.forEach(p => {
        fxCtx.fillStyle = p.z < 0 ? '#ffffff' : mainColor;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.z < 0 ? 3 : 1.8, 0, Math.PI * 2);
        fxCtx.fill();
      });

      fxCtx.restore();
    }

    // --- 3. MOD: LAZER KESME OYUNU ---
    function updateAndRenderNinja(w, h, handPoints) {
      const now = Date.now();
      if (now - lastSpawn > 1100) {
        lastSpawn = now;
        const isBomb = Math.random() < 0.22;
        targets.push({
          x: Math.random() * (w * 0.7) + w * 0.15,
          y: h + 30,
          vx: (Math.random() - 0.5) * 5,
          vy: -(Math.random() * 7 + 12),
          radius: 28,
          isBomb,
          color: isBomb ? '#ff2e2e' : (Math.random() < 0.5 ? '#00f2ff' : '#32ff7e')
        });
      }

      // Lazer kılıcı izi
      if (handPoints.length > 0) {
        bladeTrail.push({ x: handPoints[0].x, y: handPoints[0].y, life: 1.0 });
      }
      fxCtx.save();
      fxCtx.globalCompositeOperation = 'lighter';
      for (let i = bladeTrail.length - 1; i > 0; i--) {
        const b1 = bladeTrail[i];
        const b2 = bladeTrail[i - 1];
        b1.life -= 0.12;
        if (b1.life <= 0) { bladeTrail.splice(i, 1); continue; }
        fxCtx.beginPath();
        fxCtx.moveTo(b1.x, b1.y);
        fxCtx.lineTo(b2.x, b2.y);
        fxCtx.strokeStyle = `rgba(0, 242, 255, ${b1.life})`;
        fxCtx.shadowColor = '#00f2ff';
        fxCtx.shadowBlur = 15;
        fxCtx.lineWidth = b1.life * 10;
        fxCtx.lineCap = 'round';
        fxCtx.stroke();
      }
      fxCtx.restore();

      // Hedefleri güncelle ve çarpışma kontrolü yap
      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        t.x += t.vx;
        t.y += t.vy;
        t.vy += 0.28; // Yerçekimi

        // El teması kontrolü
        let sliced = false;
        for (const hp of handPoints) {
          if (Math.hypot(hp.x - t.x, hp.y - t.y) < t.radius + 18) {
            sliced = true;
            break;
          }
        }

        if (sliced) {
          if (t.isBomb) {
            score = Math.max(0, score - 5);
            spawnBurst(t.x, t.y, '#ff2e2e', 30);
            container.style.transform = 'translate(10px, -10px)';
            setTimeout(() => { container.style.transform = 'translate(0,0)'; }, 120);
          } else {
            score += 1;
            spawnBurst(t.x, t.y, t.color, 20);
          }
          scoreBoard.innerText = `SKOR: ${score}`;
          targets.splice(i, 1);
          continue;
        }

        if (t.y > h + 60) {
          targets.splice(i, 1);
          continue;
        }

        // Hedef çizimi
        fxCtx.save();
        fxCtx.beginPath();
        fxCtx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
        fxCtx.fillStyle = t.color;
        fxCtx.shadowColor = t.color;
        fxCtx.shadowBlur = 18;
        fxCtx.fill();
        if (t.isBomb) {
          fxCtx.fillStyle = '#000';
          fxCtx.font = 'bold 20px sans-serif';
          fxCtx.textAlign = 'center';
          fxCtx.textBaseline = 'middle';
          fxCtx.fillText('✖', t.x, t.y);
        }
        fxCtx.restore();
      }
    }

    function drawSkeleton(lm) {
      const w = window.innerWidth, h = window.innerHeight;
      fxCtx.strokeStyle = 'rgba(0, 242, 255, 0.5)';
      fxCtx.lineWidth = 2;
      CONNECTIONS.forEach(([i, j]) => {
        fxCtx.beginPath();
        fxCtx.moveTo((1 - lm[i].x) * w, lm[i].y * h);
        fxCtx.lineTo((1 - lm[j].x) * w, lm[j].y * h);
        fxCtx.stroke();
      });
      lm.forEach((pt, idx) => {
        const isTip = [4, 8, 12, 16, 20].includes(idx);
        fxCtx.beginPath();
        fxCtx.arc((1 - pt.x) * w, pt.y * h, isTip ? 4.5 : 2.5, 0, Math.PI * 2);
        fxCtx.fillStyle = isTip ? '#ff4757' : '#ffffff';
        fxCtx.fill();
      });
    }

    function isFingerExtended(lm, tipIdx, pipIdx) {
      const w = lm[0], t = lm[tipIdx], p = lm[pipIdx];
      return Math.hypot(t.x - w.x, t.y - w.y) > Math.hypot(p.x - w.x, p.y - w.y) * 1.15;
    }

    function getHandState(lm) {
      const i = isFingerExtended(lm, 8, 6);
      const m = isFingerExtended(lm, 12, 10);
      const r = isFingerExtended(lm, 16, 14);
      const p = isFingerExtended(lm, 20, 18);
      return {
        isOpen: i && m && r && p,
        isFist: !i && !m && !r && !p
      };
    }

    function onResults(results) {
      const w = window.innerWidth, h = window.innerHeight;
      fxCtx.clearRect(0, 0, w, h);
      const handsList = results.multiHandLandmarks || [];
      const handedness = results.multiHandedness || [];

      if (handsList.length > 0 && showSkeleton) {
        handsList.forEach(lm => drawSkeleton(lm));
      }

      // === MOD 1: SÜPER GÜÇLER ===
      if (currentMode === 'powers') {
        if (handsList.length === 2) {
          const h1 = getHandState(handsList[0]);
          const h2 = getHandState(handsList[1]);
          const p1x = (1 - handsList[0][9].x) * w, p1y = handsList[0][9].y * h;
          const p2x = (1 - handsList[1][9].x) * w, p2y = handsList[1][9].y * h;
          const cx = (p1x + p2x) / 2, cy = (p1y + p2y) / 2;
          const dist = Math.hypot(p2x - p1x, p2y - p1y);

          if (h1.isOpen && h2.isOpen) {
            plasmaCharge = Math.min(plasmaCharge + 1, 25);
            const r = Math.max(35, Math.min(dist * 0.45, 160));
            const grad = fxCtx.createRadialGradient(cx, cy, 5, cx, cy, r);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.4, '#b53471');
            grad.addColorStop(0.8, 'rgba(0, 242, 255, 0.6)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            fxCtx.save();
            fxCtx.globalCompositeOperation = 'lighter';
            fxCtx.fillStyle = grad;
            fxCtx.beginPath();
            fxCtx.arc(cx, cy, r, 0, Math.PI * 2);
            fxCtx.fill();
            fxCtx.restore();
            spawnLightning(cx, cy);
            statusText.innerText = "🔮 PLAZMA TOPU HAZIR! (Fırlatmak için YUMRUK yap)";
          } else if ((h1.isFist || h2.isFist) && plasmaCharge >= 6) {
            launchPlasmaBall(cx, cy, 60);
            plasmaCharge = 0;
            statusText.innerText = "💥 PLAZMA FIRLATILDI!";
          } else {
            statusText.innerText = "🔮 Plazma topu için iki avucunu aç";
          }
        } else if (handsList.length === 1) {
          const lm = handsList[0];
          const state = getHandState(lm);
          const palmX = (1 - lm[9].x) * w, palmY = lm[9].y * h;
          // Ayna görüntüsünde Left = Sağ el, Right = Sol eldir
          const isRightHand = handedness[0]?.label === 'Left';

          if (state.isOpen) {
            plasmaCharge = Math.min(plasmaCharge + 1, 20);
            if (isRightHand) {
              spawnFire(palmX, palmY, 10);
              statusText.innerText = "🔥 SAĞ EL: Alev Gücü";
            } else {
              spawnLightning(palmX, palmY);
              statusText.innerText = "⚡ SOL EL: Şimşek Gücü";
            }
          } else if (state.isFist && plasmaCharge >= 8) {
            launchPlasmaBall(palmX, palmY, 45);
            plasmaCharge = 0;
            statusText.innerText = "💥 ENERJİ PATLAMASI!";
          } else {
            plasmaCharge = 0;
            statusText.innerText = "✋ Güç için avucunu aç (Sağ: Alev, Sol: Şimşek)";
          }
        } else {
          plasmaCharge = 0;
          statusText.innerText = "Ellerini kameraya göster";
        }
      }

      // === MOD 2: 3D HOLOGRAM ===
      else if (currentMode === 'holo') {
        let cx = w / 2, cy = h / 2;
        let isOverload = false;

        if (handsList.length === 2) {
          const p1x = (1 - handsList[0][9].x) * w, p1y = handsList[0][9].y * h;
          const p2x = (1 - handsList[1][9].x) * w, p2y = handsList[1][9].y * h;
          cx = (p1x + p2x) / 2;
          cy = (p1y + p2y) / 2;
          const dist = Math.hypot(p2x - p1x, p2y - p1y);
          holoScale = Math.max(0.5, Math.min(dist / 180, 2.4));
          holoRotY += 0.03;
          statusText.innerText = `🌐 3D ZOOM: %${Math.round(holoScale * 100)}`;
        } else if (handsList.length === 1) {
          const lm = handsList[0];
          const state = getHandState(lm);
          cx = (1 - lm[9].x) * w;
          cy = lm[9].y * h;
          holoRotY = (lm[9].x - 0.5) * 5;
          holoRotX = (lm[9].y - 0.5) * 4;
          isOverload = state.isFist;
          statusText.innerText = isOverload ? "⚠️ ÇEKİRDEK AŞIRI YÜKLENDİ" : "🌐 Tek el: Döndür | İki el: Büyüt/Küçült";
        } else {
          holoRotY += 0.015;
          statusText.innerText = "🌐 Hologramı tutmak için elini göster";
        }
        renderHologram(cx, cy, holoScale, holoRotX, holoRotY, isOverload);
      }

      // === MOD 3: LAZER KESME ===
      else if (currentMode === 'ninja') {
        const activePoints = handsList.map(lm => ({
          x: (1 - lm[8].x) * w,
          y: lm[8].y * h
        }));
        updateAndRenderNinja(w, h, activePoints);
        statusText.innerText = handsList.length > 0 ? "⚔️ Küreleri kes! (Kırmızı bombalardan kaç)" : "⚔️ Lazer kılıcı için elini göster";
      }

      updateAndDrawParticles();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });
    hands.onResults(onResults);

    async function startCamera() {
      try {
        statusText.innerText = "HD Kamera açılıyor...";
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        statusText.innerText = "Model yükleniyor...";
        requestAnimationFrame(processFrame);
      } catch (err) {
        statusText.innerText = "Kamera hatası: " + err.message;
      }
    }

    async function processFrame() {
      if (!isProcessing && video.readyState >= 2) {
        isProcessing = true;
        try {
          await hands.send({ image: video });
        } catch (e) {
          statusText.innerText = "AI Hatası: " + e.message;
        }
        isProcessing = false;
      }
      requestAnimationFrame(processFrame);
    }

    startCamera();
  </script>
</body>
